name: Scale journey
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Diagnostic or extended admitted dimensions
        type: choice
        default: diagnostic
        options: [diagnostic, dimensions]
  pull_request:
    paths:
      - .github/workflows/scale.yml
      - scripts/scale/**
      - tests/chest/scale*.mjs
permissions:
  contents: read
jobs:
  scale:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      CHEST_SCALE_DEPTH: ${{ inputs.profile == 'dimensions' && '100' || '8' }}
      CHEST_SCALE_DIRECT_MEMBERS: ${{ inputs.profile == 'dimensions' && '600' || '0' }}
      CHEST_SCALE_DEVICES: ${{ inputs.profile == 'dimensions' && '298' || '0' }}
      CHEST_SCALE_CHANGES: ${{ inputs.profile == 'dimensions' && '10000' || '20' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile && pnpm exec rer install
      - run: node scripts/install-browser.mjs
      - run: pnpm run build
      - name: Run committed bounded scale journey
        run: timeout 1200 node tests/chest/scale.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chest-scale-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            test-results/scale.json
            test-results/*-scale*.png
