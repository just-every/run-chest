name: Verify
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '41 18 * * *'
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.reuse.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          WF_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          wf="${WF_REF%@*}"; wf="${wf##*/}"
          # Evidence is only a push run of this workflow from this repository, never this run: a pull request
          # tests its merge ref, a dispatch may run a subset, and a PR run of this workflow may itself be a skip.
          # Prints "<status> <conclusion>" of the newest such run on SHA $1, or nothing (any API error: nothing).
          newest_push() {
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?head_sha=$1&event=push&per_page=100" \
              --jq "[.workflow_runs[] | select(.head_repository.full_name == \"$GITHUB_REPOSITORY\" and .id != $GITHUB_RUN_ID)] | max_by(.id) | select(. != null) | \"\(.status) \(.conclusion)\"" || true
          }
          green() { [ "$(newest_push "$1")" = "completed success" ]; }
          skip=false
          # C1: main push of a SHA whose newest push run of this workflow (a branch run) is green.
          if [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ] && green "$GITHUB_SHA"; then skip=true; fi
          # C3 (exact): same tree as the parent, and the parent's newest push run is green (e.g. an empty commit).
          if [ "$skip" = false ] && [ "$EVENT" = push ] && parent=$(git rev-parse -q --verify HEAD~1) \
             && [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'HEAD~1^{tree}')" ] && green "$parent"; then skip=true; fi
          # C2: same-repository PR. The lander takes any green same-repo run on the exact SHA as evidence,
          # pull_request runs included, so this run may pass without shards only when the push run on the
          # PR head is green: wait for it (at most 25 minutes).
          # No push run, any other result, or the wait running out: run in full.
          if [ "$EVENT" = pull_request ] && [ "$SAME_REPO" = true ]; then
            for _ in $(seq 1 50); do
              state=$(newest_push "$PR_HEAD")
              case "$state" in
                'completed success') skip=true; break ;;
                ''|completed\ *) break ;;
                *) sleep 30 ;;
              esac
            done
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
  # Parallel push shards keep the core, role and Office journeys within the job budget.
  # The fresh-clone installer journey retains coverage on release tags, nightly and manual runs.
  rer-verify:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - name: Recover unused Android SDK space
        # GitHub's Ubuntu image documents this SDK path; Chest uses no Android tools.
        # https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2404-Readme.md#android
        run: |
          set -euo pipefail
          # Temporary files use the runner disk measured by the space guard.
          export TMPDIR="$RUNNER_TEMP"
          printf 'TMPDIR=%s\n' "$TMPDIR" >> "$GITHUB_ENV"
          printf 'Disk space before Android SDK removal\n'
          df -h . /tmp
          sudo rm -rf -- /usr/local/lib/android/sdk
          printf 'Disk space after Android SDK removal\n'
          df -h . /tmp
          node --input-type=module <<'NODE'
          import {statfs} from 'node:fs/promises';
          import {tmpdir} from 'node:os';
          const minimum = 15n * 1024n ** 3n;
          for (const [label, path] of [['checkout', process.cwd()], ['temporary', tmpdir()]]) {
            const state = await statfs(path, {bigint: true});
            const free = state.bavail * state.bsize;
            console.log(`${label}: ${(Number(free) / 1024 ** 3).toFixed(2)} GiB free; requires at least 15 GiB`);
            if (free < minimum) throw Error(`${label} volume has insufficient free space for the real RER server`);
          }
          NODE
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile && pnpm exec rer install
      - run: pnpm exec rer check --profile first-party
      - run: pnpm exec rer verify
  browser:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        suite: [files, other, office, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - name: Recover unused Android SDK space
        # GitHub's Ubuntu image documents this SDK path; Chest uses no Android tools.
        # https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2404-Readme.md#android
        run: |
          set -euo pipefail
          # Temporary files use the runner disk measured by the space guard.
          export TMPDIR="$RUNNER_TEMP"
          printf 'TMPDIR=%s\n' "$TMPDIR" >> "$GITHUB_ENV"
          printf 'Disk space before Android SDK removal\n'
          df -h . /tmp
          sudo rm -rf -- /usr/local/lib/android/sdk
          printf 'Disk space after Android SDK removal\n'
          df -h . /tmp
          node --input-type=module <<'NODE'
          import {statfs} from 'node:fs/promises';
          import {tmpdir} from 'node:os';
          const minimum = 15n * 1024n ** 3n;
          for (const [label, path] of [['checkout', process.cwd()], ['temporary', tmpdir()]]) {
            const state = await statfs(path, {bigint: true});
            const free = state.bavail * state.bsize;
            console.log(`${label}: ${(Number(free) / 1024 ** 3).toFixed(2)} GiB free; requires at least 15 GiB`);
            if (free < minimum) throw Error(`${label} volume has insufficient free space for the real RER server`);
          }
          NODE
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile && pnpm exec rer install
      - run: node scripts/install-browser.mjs
      - run: pnpm run build
      - if: matrix.suite == 'office'
        run: pnpm run test:chest:office
      - run: pnpm run test:browser:${{ matrix.suite }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chest-files-pages-${{ matrix.suite }}
          path: test-results/*.png
  journey:
    needs: plan
    if: needs.plan.outputs.skip != 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - name: Recover unused Android SDK space
        # GitHub's Ubuntu image documents this SDK path; Chest uses no Android tools.
        # https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2404-Readme.md#android
        run: |
          set -euo pipefail
          # Temporary files use the runner disk measured by the space guard.
          export TMPDIR="$RUNNER_TEMP"
          printf 'TMPDIR=%s\n' "$TMPDIR" >> "$GITHUB_ENV"
          printf 'Disk space before Android SDK removal\n'
          df -h . /tmp
          sudo rm -rf -- /usr/local/lib/android/sdk
          printf 'Disk space after Android SDK removal\n'
          df -h . /tmp
          node --input-type=module <<'NODE'
          import {statfs} from 'node:fs/promises';
          import {tmpdir} from 'node:os';
          const minimum = 15n * 1024n ** 3n;
          for (const [label, path] of [['checkout', process.cwd()], ['temporary', tmpdir()]]) {
            const state = await statfs(path, {bigint: true});
            const free = state.bavail * state.bsize;
            console.log(`${label}: ${(Number(free) / 1024 ** 3).toFixed(2)} GiB free; requires at least 15 GiB`);
            if (free < minimum) throw Error(`${label} volume has insufficient free space for the real RER server`);
          }
          NODE
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile && pnpm exec rer install
      - run: node scripts/install-browser.mjs
      - run: pnpm run test:journey
        env:
          CHEST_TEST_CHECKOUT: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chest-browser-pages
          path: test-results/*.png

  extra:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    # Signatures: HTTP journeys against the built Worker, then their browser journeys at 1440 and 390.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile
      - run: node scripts/install-browser.mjs
      - run: pnpm run build
      - run: pnpm run test:chest:extra
      - run: pnpm run test:browser:extra
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chest-pages-extra
          path: test-results/*.png
  organisation:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: just-every/run-auth
          ref: ba5db7d3747fc6a8ecbfb82e0e5c55f81b45b0f3
          path: .test-auth
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile
      - run: node scripts/install-browser.mjs
      - run: pnpm run build
      - run: pnpm install --frozen-lockfile && pnpm exec vite build
        working-directory: .test-auth
      - run: pnpm run test:organisation
        env:
          CHEST_AUTH_CHECKOUT: .test-auth
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chest-lifecycle-pages
          path: test-results/*-lifecycle-*.png

  upgrade:
    needs: plan
    if: needs.plan.outputs.skip != 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile && pnpm exec rer install
      - run: node scripts/install-browser.mjs
      - run: pnpm run test:upgrade
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chest-upgrade-pages
          path: test-results/*-upgrade-*.png

  verify:
    needs: [plan, rer-verify, browser, extra, organisation]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require the plan and every shard
        env:
          PLAN: ${{ needs.plan.result }}
          SKIP: ${{ needs.plan.outputs.skip }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          test "$PLAN" = success
          if [ "$SKIP" = true ]; then exit 0; fi
          for result in $RESULTS; do test "$result" = success; done
