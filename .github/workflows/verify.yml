name: Verify
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      tier:
        type: string
        default: push
      timeout:
        type: number
        default: 15
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.plan.outputs.skip }}
      coverage: ${{ steps.plan.outputs.coverage }}
      tier: ${{ steps.plan.outputs.tier }}
      readers: ${{ steps.plan.outputs.readers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Check reusable workflow permissions
        run: node scripts/verify-ci.mjs --check-workflows
      - name: Look up complete nightly marker
        id: nightly
        if: ${{ github.event_name == 'schedule' || inputs.tier == 'nightly' }}
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ runner.temp }}/nightly-green
          key: nightly-green-${{ github.sha }}
          lookup-only: true
      - id: plan
        env:
          TIER: ${{ inputs.tier || 'push' }}
          GITHUB_TOKEN: ${{ github.token }}
          NIGHTLY_CACHE_HIT: ${{ steps.nightly.outputs.cache-hit }}
        run: node scripts/verify-ci.mjs --plan
  # Seven push shards retain Chest's public flows; browser shards share the verified Worker build.
  # Fresh-clone and upgrade journeys run on release tags and the separate twice-weekly nightly.
  rer-verify:
    name: shards (rer-verify)
    needs: plan
    if: needs.plan.outputs.coverage == 'full' && (needs.plan.outputs.tier == 'push' || needs.plan.outputs.tier == 'all')
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout || 15 }}
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      PLAYWRIGHT_SKIP_BROWSER_GC: '1'
    steps:
      - name: Prepare runner-owned caches
        run: |
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s/ms-playwright\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/pnpm-store" "$RUNNER_TEMP/ms-playwright" "$RUNNER_TEMP/rer-apt/archives"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Contract coverage names Chest's historical conversion source.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - name: Check edition source lock freshness
        run: node scripts/edition-authoring/cli.mjs check
      - run: npm install --global pnpm@10.12.4
      - name: Set runner-owned pnpm store
        run: pnpm config set store-dir "$RUNNER_TEMP/pnpm-store"
      - name: Cache frozen dependencies and Chromium
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ${{ runner.temp }}/pnpm-store
            ${{ runner.temp }}/ms-playwright
            ${{ runner.temp }}/rer-apt/archives/*.deb
          key: chest-ubuntu24-temp-store-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml', 'package.json', '.test-auth/pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec rer check --profile first-party
      - run: node src/base/contract-docs.mjs check
      - run: pnpm exec rer verify
      - name: Share the verified Worker build
        uses: actions/upload-artifact@v4
        with:
          name: chest-built-worker
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
  browser:
    name: shards (browser-${{ matrix.suite }})
    needs: [plan, rer-verify]
    if: needs.plan.outputs.coverage == 'full' && (needs.plan.outputs.tier == 'push' || needs.plan.outputs.tier == 'all')
    strategy:
      fail-fast: false
      matrix:
        suite: [files, other, office, security]
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout || 15 }}
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      PLAYWRIGHT_SKIP_BROWSER_GC: '1'
    steps:
      - name: Prepare runner-owned caches
        run: |
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s/ms-playwright\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/pnpm-store" "$RUNNER_TEMP/ms-playwright" "$RUNNER_TEMP/rer-apt/archives"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - run: npm install --global pnpm@10.12.4
      - name: Set runner-owned pnpm store
        run: pnpm config set store-dir "$RUNNER_TEMP/pnpm-store"
      - name: Cache frozen dependencies and Chromium
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ${{ runner.temp }}/pnpm-store
            ${{ runner.temp }}/ms-playwright
            ${{ runner.temp }}/rer-apt/archives/*.deb
          key: chest-ubuntu24-temp-store-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml', 'package.json', '.test-auth/pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: node scripts/install-browser.mjs scripts/install-chromium-deps.py
      - name: Restore the verified Worker build
        uses: actions/download-artifact@v4
        with:
          name: chest-built-worker
          path: dist/
      - if: matrix.suite == 'office'
        run: pnpm run test:chest:office
      - run: pnpm run test:browser:${{ matrix.suite }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chest-files-pages-${{ matrix.suite }}
          path: test-results/*.png
  journey:
    name: shards (journey)
    needs: plan
    if: needs.plan.outputs.coverage == 'full' && (needs.plan.outputs.tier == 'nightly' || needs.plan.outputs.tier == 'all')
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout || 15 }}
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      PLAYWRIGHT_SKIP_BROWSER_GC: '1'
    steps:
      - name: Prepare runner-owned caches
        run: |
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s/ms-playwright\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/pnpm-store" "$RUNNER_TEMP/ms-playwright" "$RUNNER_TEMP/rer-apt/archives"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - name: Recover unused Android SDK space
        # GitHub's Ubuntu image documents this SDK path; Chest uses no Android tools.
        # https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2404-Readme.md#android
        run: |
          set -euo pipefail
          # Temporary files use the runner disk measured by the space guard.
          export TMPDIR="$RUNNER_TEMP"
          printf 'TMPDIR=%s\n' "$TMPDIR" >> "$GITHUB_ENV"
          printf 'Disk space before Android SDK removal\n'
          df -h . /tmp
          sudo rm -rf -- /usr/local/lib/android/sdk
          printf 'Disk space after Android SDK removal\n'
          df -h . /tmp
          node --input-type=module <<'NODE'
          import {statfs} from 'node:fs/promises';
          import {tmpdir} from 'node:os';
          const minimum = 15n * 1024n ** 3n;
          for (const [label, path] of [['checkout', process.cwd()], ['temporary', tmpdir()]]) {
            const state = await statfs(path, {bigint: true});
            const free = state.bavail * state.bsize;
            console.log(`${label}: ${(Number(free) / 1024 ** 3).toFixed(2)} GiB free; requires at least 15 GiB`);
            if (free < minimum) throw Error(`${label} volume has insufficient free space for the real RER server`);
          }
          NODE
      - name: Check edition source lock freshness
        run: node scripts/edition-authoring/cli.mjs check
      - run: npm install --global pnpm@10.12.4
      - name: Set runner-owned pnpm store
        run: pnpm config set store-dir "$RUNNER_TEMP/pnpm-store"
      - name: Cache frozen dependencies and Chromium
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ${{ runner.temp }}/pnpm-store
            ${{ runner.temp }}/ms-playwright
            ${{ runner.temp }}/rer-apt/archives/*.deb
          key: chest-ubuntu24-temp-store-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml', 'package.json', '.test-auth/pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: node scripts/install-browser.mjs scripts/install-chromium-deps.py
      - run: pnpm run test:journey
        env:
          CHEST_TEST_CHECKOUT: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chest-browser-pages
          path: test-results/*.png

  extra:
    name: shards (extra)
    needs: [plan, rer-verify]
    if: needs.plan.outputs.coverage == 'full' && (needs.plan.outputs.tier == 'push' || needs.plan.outputs.tier == 'all')
    # Signatures: HTTP journeys against the built Worker, then their browser journeys at 1440 and 390.
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout || 15 }}
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      PLAYWRIGHT_SKIP_BROWSER_GC: '1'
    steps:
      - name: Prepare runner-owned caches
        run: |
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s/ms-playwright\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/pnpm-store" "$RUNNER_TEMP/ms-playwright" "$RUNNER_TEMP/rer-apt/archives"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - run: npm install --global pnpm@10.12.4
      - name: Set runner-owned pnpm store
        run: pnpm config set store-dir "$RUNNER_TEMP/pnpm-store"
      - name: Cache frozen dependencies and Chromium
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ${{ runner.temp }}/pnpm-store
            ${{ runner.temp }}/ms-playwright
            ${{ runner.temp }}/rer-apt/archives/*.deb
          key: chest-ubuntu24-temp-store-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml', 'package.json', '.test-auth/pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: node scripts/install-browser.mjs scripts/install-chromium-deps.py
      - name: Restore the verified Worker build
        uses: actions/download-artifact@v4
        with:
          name: chest-built-worker
          path: dist/
      - run: pnpm run test:chest:extra
      - run: pnpm run test:browser:extra
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chest-pages-extra
          path: test-results/*.png
  organisation:
    name: shards (organisation)
    needs: [plan, rer-verify]
    if: needs.plan.outputs.coverage == 'full' && (needs.plan.outputs.tier == 'push' || needs.plan.outputs.tier == 'all')
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout || 15 }}
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      PLAYWRIGHT_SKIP_BROWSER_GC: '1'
    steps:
      - name: Prepare runner-owned caches
        run: |
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s/ms-playwright\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/pnpm-store" "$RUNNER_TEMP/ms-playwright" "$RUNNER_TEMP/rer-apt/archives"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          repository: just-every/run-auth
          ref: ba5db7d3747fc6a8ecbfb82e0e5c55f81b45b0f3
          path: .test-auth
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - run: npm install --global pnpm@10.12.4
      - name: Set runner-owned pnpm store
        run: pnpm config set store-dir "$RUNNER_TEMP/pnpm-store"
      - name: Cache frozen dependencies and Chromium
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ${{ runner.temp }}/pnpm-store
            ${{ runner.temp }}/ms-playwright
            ${{ runner.temp }}/rer-apt/archives/*.deb
          key: chest-ubuntu24-temp-store-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml', 'package.json', '.test-auth/pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: node scripts/install-browser.mjs scripts/install-chromium-deps.py
      - name: Restore the verified Worker build
        uses: actions/download-artifact@v4
        with:
          name: chest-built-worker
          path: dist/
      - run: pnpm install --frozen-lockfile && pnpm exec vite build
        working-directory: .test-auth
      - run: pnpm run test:organisation
        env:
          CHEST_AUTH_CHECKOUT: .test-auth
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chest-lifecycle-pages
          path: test-results/*-lifecycle-*.png

  upgrade:
    name: shards (upgrade)
    needs: plan
    if: needs.plan.outputs.coverage == 'full' && (needs.plan.outputs.tier == 'nightly' || needs.plan.outputs.tier == 'all')
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout || 15 }}
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      PLAYWRIGHT_SKIP_BROWSER_GC: '1'
    steps:
      - name: Prepare runner-owned caches
        run: |
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s/ms-playwright\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/pnpm-store" "$RUNNER_TEMP/ms-playwright" "$RUNNER_TEMP/rer-apt/archives"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - name: Check edition source lock freshness
        run: node scripts/edition-authoring/cli.mjs check
      - run: npm install --global pnpm@10.12.4
      - name: Set runner-owned pnpm store
        run: pnpm config set store-dir "$RUNNER_TEMP/pnpm-store"
      - name: Cache frozen dependencies and Chromium
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ${{ runner.temp }}/pnpm-store
            ${{ runner.temp }}/ms-playwright
            ${{ runner.temp }}/rer-apt/archives/*.deb
          key: chest-ubuntu24-temp-store-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml', 'package.json', '.test-auth/pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: node scripts/install-browser.mjs scripts/install-chromium-deps.py
      - run: pnpm run test:upgrade
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chest-upgrade-pages
          path: test-results/*-upgrade-*.png

  light:
    needs: plan
    if: needs.plan.outputs.coverage == 'light'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Contract coverage names Chest's historical conversion source.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - run: npm install --global pnpm@10.12.4
      - run: pnpm config set store-dir "$RUNNER_TEMP/pnpm-store"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ runner.temp }}/pnpm-store
          key: chest-ubuntu24-temp-store-${{ runner.arch }}-light-${{ hashFiles('pnpm-lock.yaml', 'package.json') }}
      - run: pnpm install --frozen-lockfile
      - name: Run reviewed readers and build the run site
        env:
          LIGHT_READERS: ${{ needs.plan.outputs.readers }}
        run: node scripts/verify-ci.mjs --light

  full-push-proof:
    needs: [plan, rer-verify, browser, extra, organisation]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && needs.plan.outputs.tier == 'push' && needs.plan.outputs.coverage == 'full' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require every full push shard
        env:
          RESULTS: ${{ needs.rer-verify.result }} ${{ needs.browser.result }} ${{ needs.extra.result }} ${{ needs.organisation.result }}
        run: for result in $RESULTS; do test "$result" = success; done

  nightly-proof:
    needs: [plan, rer-verify, browser, extra, organisation, journey, upgrade]
    if: ${{ always() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.plan.result == 'success' && needs.plan.outputs.coverage == 'full' && needs.journey.result == 'success' && needs.upgrade.result == 'success' && (needs.plan.outputs.tier == 'nightly' || (needs.plan.outputs.tier == 'all' && needs.rer-verify.result == 'success' && needs.browser.result == 'success' && needs.extra.result == 'success' && needs.organisation.result == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Mark successful complete nightly coverage
        run: mkdir -p "$RUNNER_TEMP/nightly-green" && printf '%s\n' '${{ github.sha }}' > "$RUNNER_TEMP/nightly-green/sha"
      - uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ runner.temp }}/nightly-green
          key: nightly-green-${{ github.sha }}

  verify:
    needs: [plan, rer-verify, browser, extra, organisation, journey, upgrade, light, full-push-proof, nightly-proof]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require the selected coverage and its proof
        env:
          PLAN: ${{ needs.plan.result }}
          SKIP: ${{ needs.plan.outputs.skip }}
          COVERAGE: ${{ needs.plan.outputs.coverage }}
          TIER: ${{ needs.plan.outputs.tier }}
          PUSH_RESULTS: ${{ needs.rer-verify.result }} ${{ needs.browser.result }} ${{ needs.extra.result }} ${{ needs.organisation.result }}
          NIGHTLY_RESULTS: ${{ needs.journey.result }} ${{ needs.upgrade.result }}
          LIGHT: ${{ needs.light.result }}
          PUSH_PROOF: ${{ needs.full-push-proof.result }}
          NIGHTLY_PROOF: ${{ needs.nightly-proof.result }}
          EXPECT_PUSH_PROOF: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && needs.plan.outputs.tier == 'push' && needs.plan.outputs.coverage == 'full' }}
          EXPECT_NIGHTLY_PROOF: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && (needs.plan.outputs.tier == 'nightly' || needs.plan.outputs.tier == 'all') && needs.plan.outputs.coverage == 'full' }}
        run: |
          set -euo pipefail
          test "$PLAN" = success
          case "$PUSH_PROOF:$NIGHTLY_PROOF" in
            *failure*|*cancelled*) exit 1 ;;
          esac
          require_results() { for result in $2; do test "$result" = "$1"; done; }
          case "$COVERAGE" in
            reuse)
              test "$SKIP" = true
              test "$LIGHT" = skipped
              require_results skipped "$PUSH_RESULTS $NIGHTLY_RESULTS"
              ;;
            light)
              test "$SKIP" = false
              test "$LIGHT" = success
              require_results skipped "$PUSH_RESULTS $NIGHTLY_RESULTS"
              ;;
            full)
              test "$SKIP" = false
              test "$LIGHT" = skipped
              case "$TIER" in
                push) require_results success "$PUSH_RESULTS"; require_results skipped "$NIGHTLY_RESULTS" ;;
                nightly) require_results skipped "$PUSH_RESULTS"; require_results success "$NIGHTLY_RESULTS" ;;
                all) require_results success "$PUSH_RESULTS $NIGHTLY_RESULTS" ;;
                *) exit 1 ;;
              esac
              ;;
            *) exit 1 ;;
          esac
          if [ "$EXPECT_PUSH_PROOF" = true ]; then test "$PUSH_PROOF" = success; fi
          if [ "$EXPECT_NIGHTLY_PROOF" = true ]; then test "$NIGHTLY_PROOF" = success; fi
