name: Verify
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '41 18 * * *'
permissions:
  contents: read
jobs:
  # Parallel push shards keep the core, role and Office journeys within the job budget.
  # The fresh-clone installer journey retains coverage on release tags, nightly and manual runs.
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - name: Recover unused Android SDK space
        # GitHub's Ubuntu image documents this SDK path; Chest uses no Android tools.
        # https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2404-Readme.md#android
        run: |
          set -euo pipefail
          # Temporary files use the runner disk measured by the space guard.
          export TMPDIR="$RUNNER_TEMP"
          printf 'TMPDIR=%s\n' "$TMPDIR" >> "$GITHUB_ENV"
          printf 'Disk space before Android SDK removal\n'
          df -h . /tmp
          sudo rm -rf -- /usr/local/lib/android/sdk
          printf 'Disk space after Android SDK removal\n'
          df -h . /tmp
          node --input-type=module <<'NODE'
          import {statfs} from 'node:fs/promises';
          import {tmpdir} from 'node:os';
          const minimum = 15n * 1024n ** 3n;
          for (const [label, path] of [['checkout', process.cwd()], ['temporary', tmpdir()]]) {
            const state = await statfs(path, {bigint: true});
            const free = state.bavail * state.bsize;
            console.log(`${label}: ${(Number(free) / 1024 ** 3).toFixed(2)} GiB free; requires at least 15 GiB`);
            if (free < minimum) throw Error(`${label} volume has insufficient free space for the real RER server`);
          }
          NODE
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile && pnpm exec rer install
      - run: pnpm exec rer check --profile first-party
      - run: pnpm exec rer verify
  browser:
    strategy:
      fail-fast: false
      matrix:
        suite: [files, other, office, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - name: Recover unused Android SDK space
        # GitHub's Ubuntu image documents this SDK path; Chest uses no Android tools.
        # https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2404-Readme.md#android
        run: |
          set -euo pipefail
          # Temporary files use the runner disk measured by the space guard.
          export TMPDIR="$RUNNER_TEMP"
          printf 'TMPDIR=%s\n' "$TMPDIR" >> "$GITHUB_ENV"
          printf 'Disk space before Android SDK removal\n'
          df -h . /tmp
          sudo rm -rf -- /usr/local/lib/android/sdk
          printf 'Disk space after Android SDK removal\n'
          df -h . /tmp
          node --input-type=module <<'NODE'
          import {statfs} from 'node:fs/promises';
          import {tmpdir} from 'node:os';
          const minimum = 15n * 1024n ** 3n;
          for (const [label, path] of [['checkout', process.cwd()], ['temporary', tmpdir()]]) {
            const state = await statfs(path, {bigint: true});
            const free = state.bavail * state.bsize;
            console.log(`${label}: ${(Number(free) / 1024 ** 3).toFixed(2)} GiB free; requires at least 15 GiB`);
            if (free < minimum) throw Error(`${label} volume has insufficient free space for the real RER server`);
          }
          NODE
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile && pnpm exec rer install
      - run: node scripts/install-browser.mjs
      - run: pnpm run build
      - if: matrix.suite == 'office'
        run: pnpm run test:chest:office
      - run: pnpm run test:browser:${{ matrix.suite }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chest-files-pages-${{ matrix.suite }}
          path: test-results/*.png
  journey:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - name: Recover unused Android SDK space
        # GitHub's Ubuntu image documents this SDK path; Chest uses no Android tools.
        # https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2404-Readme.md#android
        run: |
          set -euo pipefail
          # Temporary files use the runner disk measured by the space guard.
          export TMPDIR="$RUNNER_TEMP"
          printf 'TMPDIR=%s\n' "$TMPDIR" >> "$GITHUB_ENV"
          printf 'Disk space before Android SDK removal\n'
          df -h . /tmp
          sudo rm -rf -- /usr/local/lib/android/sdk
          printf 'Disk space after Android SDK removal\n'
          df -h . /tmp
          node --input-type=module <<'NODE'
          import {statfs} from 'node:fs/promises';
          import {tmpdir} from 'node:os';
          const minimum = 15n * 1024n ** 3n;
          for (const [label, path] of [['checkout', process.cwd()], ['temporary', tmpdir()]]) {
            const state = await statfs(path, {bigint: true});
            const free = state.bavail * state.bsize;
            console.log(`${label}: ${(Number(free) / 1024 ** 3).toFixed(2)} GiB free; requires at least 15 GiB`);
            if (free < minimum) throw Error(`${label} volume has insufficient free space for the real RER server`);
          }
          NODE
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile && pnpm exec rer install
      - run: node scripts/install-browser.mjs
      - run: pnpm run test:journey
        env:
          CHEST_TEST_CHECKOUT: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chest-browser-pages
          path: test-results/*.png

  extra:
    # Signatures: HTTP journeys against the built Worker, then their browser journeys at 1440 and 390.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile
      - run: node scripts/install-browser.mjs
      - run: pnpm run build
      - run: pnpm run test:chest:extra
      - run: pnpm run test:browser:extra
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chest-pages-extra
          path: test-results/*.png
  organisation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: just-every/run-auth
          ref: ba5db7d3747fc6a8ecbfb82e0e5c55f81b45b0f3
          path: .test-auth
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile
      - run: node scripts/install-browser.mjs
      - run: pnpm run build
      - run: pnpm install --frozen-lockfile && pnpm exec vite build
        working-directory: .test-auth
      - run: pnpm run test:organisation
        env:
          CHEST_AUTH_CHECKOUT: .test-auth
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chest-lifecycle-pages
          path: test-results/*-lifecycle-*.png

  upgrade:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile && pnpm exec rer install
      - run: node scripts/install-browser.mjs
      - run: pnpm run test:upgrade
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chest-upgrade-pages
          path: test-results/*-upgrade-*.png
